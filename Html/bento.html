<!DOCTYPE html>
<html>
<head>
<style>

.bento{
       display:flex;
       flex-direction:column;
       width:800px;
       height:400px;
       gap:10px;
}

.box{
 
  background: #222;
    color: white;

    border-radius: 15px;

    display: flex;
    justify-content: center;
    align-items: center;
}

.row{
    display:flex;
    gap:10px;

}
.row1{
    flex:2;
}
.row2{
    flex:1;
}
.box1{
flex:2;
}
.box2{
flex:1;
}
.box3{
flex:1;
}
.box4{
flex:1;
}.box5{
flex:1;
}
</style>
</head>


<body> 
<div class="bento">
<div class="row row1">
<div class="box box1">BOX1</div>
<div class="box box2">BOX2</div>
</div>
<div class="row row2">
<div class="box box3">BOX3</div>
<div class="box box4">BOX4</div>
<div class="box box5">BOX5</div>
</div>
</div>
</body>
