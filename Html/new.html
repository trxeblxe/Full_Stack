<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body{
        font-size: 45px;
    }
    .parent{
        font-size: 20px;
    }
    .parent{
        container-type: inline-size;
        container-name: parent;
    }
    @container parent (max-inline-size: 800px) {
        .child{
            font-size: 30px;
            background-color: red;
        } 
    }
     
   
    </style>
</head>
<body>
    <div class="parent">
    <div class="child">Hello, world!</div>
    </div>
</body>
</html>
