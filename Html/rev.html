<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            
            display: grid;
            /* grid-template-columns: 100px 100px ; */
             grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); /* Keeps empty columns available */
            /* grid-template-rows: 100px 100px 100px; */
           /*  grid-template-rows: repeat(3, 1fr); this is the same as the above line */
           outline: 1px solid rgb(0, 0, 0);
           grid-template-areas:
            "box1 box1 box2"
            "box1 box1 box2"
            "box3 box4 box5"
            "box3 box6 box5"
            "box7 box6 box5";
            height: 100vh;
            width: 100vw;
           
            
        }
        .container>div{
            font-size: 30px;
            outline: 1px dashed rgb(0, 0, 0);
            border-radius: 10px;
            padding: 20px;
            color: white;
            background-color: rgb(157, 151, 151);
            
        }

        
    </style>
</head>
<body>
<div class = "container">
<div style="grid-area: box1;">1</div>
<div style="grid-area: box2; background-color: rgb(36, 59, 2);">2</div>
<div style="grid-area: box3;background-color: rgb(173, 77, 12);">3</div>
<div style="grid-area: box4;">4</div>
<div style="grid-area: box5;">5</div>
<div style="grid-area: box6;background-color: rgb(46, 73, 6)">6</div>
<div style="grid-area: box7;">7</div>
</div>
    
</body>
</html>
