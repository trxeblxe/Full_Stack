<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #5b3030;
            font-family: Arial, sans-serif;
        }

        .shadow-card {
            width: 400px;
            padding: 30px;
            background-color: white;
            box-shadow: 0 4px 12px #c33838;
            text-align: center;
        }

        .shadow-card h1 {
            margin: 0 0 12px;
            color: #2d0606;
            text-shadow: 2px 2px 3px #e12121,4px 4px 5px #825757;
        }

        .shadow-card p {
            margin: 0;
            color: #090910;
            line-height: 1.5;
        }

        .shadow-card img {
            width: 100%;
            height: auto;
            margin-top: 20px;
            filter: drop-shadow(6px 6px 4px #888888);
        }
    </style>
</head>
<body>
    <main class="shadow-card">
        <h1>Kshitij weds Avneesh</h1>
        <p>Shadi main jalulll jalulll anaa.</p>
        <img src="C:\Users\Sahil\Desktop\3Cards\nokia.png" alt="Wedding Image">
    </main>
</body>
</html>
