<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --grid-gap: 10px;
            --primary-color: #dedede;
            --text-size: 30px;
        }
        .container{
            height: 500px;
            width: 500px;
            display: grid;
            outline: 1px solid rgb(0, 0, 0);
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }
        .container>div{
            
            font-size: calc(var(--text-size) * 2);
            outline: 1px dashed rgb(0, 0, 0);
          
        }
       .parent{
        display: grid;
        background-color: rgb(224, 172, 69);
        grid-template-columns: subgrid;
        grid-template-rows: subgrid;
        grid-column: 1/3;
        grid-row: 1/3;
       }
       .child{
        background-color: var(--primary-color);
        color: white;
        grid-column: 2/3;
        grid-row:2/3;
       
       }
    </style>
</head>
<body>
    <div class = "container">
        <div class = "parent">
            <div class = "child">kajrare kajrare tere karre karre naina!!!</div>
            </div>
    </div>
</body>
</html>
