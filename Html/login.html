<html>
    <head><title>Login</title></head>
    <body>
        <h1 style="text-align: center;">Login Form</h1>

        flex-wrap: wrap;
        flex-direction: row;
        justify-content: center; 
        border: 1px solid black ;
        height: 400px; width: 400px; 
        margin: auto; padding: 10px;">

        </form>
        </div>
    </body>
</html>
