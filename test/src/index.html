<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dark Mode Toggle</title>

  
    <script src="https://cdn.tailwindcss.com"></script>

    
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
</head>

<body class="min-h-screen bg-white text-gray-900 transition-colors duration-300
             dark:bg-gray-900 dark:text-white">

    <div class="flex min-h-screen items-center justify-center p-6">

        <div class="w-full max-w-md rounded-2xl bg-gray-100 p-8 text-center shadow-lg
                    dark:bg-gray-800">

            <h1 class="text-3xl font-bold">
                Dark Mode
            </h1>

            <p class="mt-3 text-gray-600 dark:text-gray-300">
                Click the button to switch between light and dark mode.
            </p>

            <button
                id="themeButton"
                class="mt-6 rounded-lg bg-black px-6 py-3 font-medium text-white
                       transition hover:bg-gray-800
                       dark:bg-white dark:text-black dark:hover:bg-gray-200"
            >
                🌙 Dark Mode
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
